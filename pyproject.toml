[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobshop-env"
version = "0.1.0"
description = "Small job-shop scheduling environment with a separate final-state verifier."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jobshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
